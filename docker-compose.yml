version: '3.8'

services:
  powermind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powermind-llm
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=PowerMind
      - ENV=production
      - LLM_PROVIDER=mock
      - LLM_MODEL=gemini-2.5-flash
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SOLVER_TIMEOUT_SECONDS=10.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
